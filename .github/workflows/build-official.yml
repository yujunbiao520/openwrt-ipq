name: Build Official NSS Firmware

on:
  workflow_dispatch:

  jobs:
    build:
        runs-on: ubuntu-22.04
            timeout-minutes: 720
                steps:
                      - name: Checkout
                              uses: actions/checkout@v4
                                      with:
                                                submodules: recursive

                                                      - name: Install dependencies
                                                              run: |
                                                                        sudo apt update
                                                                                  sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget python3-ply qemu-utils

                                                                                        - name: Copy official seed config
                                                                                                run: cp nss-setup/config-nss.seed .config

                                                                                                      - name: Enable RT-AX89X and Chinese language
                                                                                                              run: |
                                                                                                                        sed -i 's/# CONFIG_TARGET_qualcommax_ipq807x_DEVICE_asus_rt-ax89x is not set/CONFIG_TARGET_qualcommax_ipq807x_DEVICE_asus_rt-ax89x=y/' .config
                                                                                                                                  echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
                                                                                                                                            echo "CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y" >> .config
                                                                                                                                                      echo "CONFIG_PACKAGE_luci-i18n-opkg-zh-cn=y" >> .config
                                                                                                                                                                echo "CONFIG_PACKAGE_luci-i18n-system-zh-cn=y" >> .config
                                                                                                                                                                          echo "CONFIG_PACKAGE_luci-i18n-network-zh-cn=y" >> .config
                                                                                                                                                                          
                                                                                                                                                                                - name: Update feeds
                                                                                                                                                                                        run: |
                                                                                                                                                                                                  ./scripts/feeds update -a
                                                                                                                                                                                                            ./scripts/feeds install -a
                                                                                                                                                                                                            
                                                                                                                                                                                                                  - name: Expand config
                                                                                                                                                                                                                          run: make defconfig V=s
                                                                                                                                                                                                                          
                                                                                                                                                                                                                                - name: Download sources
                                                                                                                                                                                                                                        run: make download -j8
                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                              - name: Build firmware
                                                                                                                                                                                                                                                      run: make -j$(nproc) V=s
                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                            - name: Upload firmware
                                                                                                                                                                                                                                                                    uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                                                            with:
                                                                                                                                                                                                                                                                                      name: ax89x-nss-official
                                                                                                                                                                                                                                                                                                path: bin/targets/qualcommax/ipq807x/*asus_rt-ax89x*
                                                                                                                                                                                                                                                                                                
