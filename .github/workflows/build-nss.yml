name: Build NSS Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure firmware
        run: |
          cp nss-setup/config-nss.seed .config
          sed -i 's/# CONFIG_TARGET_qualcommax_ipq807x_DEVICE_asus_rt-ax89x is not set/CONFIG_TARGET_qualcommax_ipq807x_DEVICE_asus_rt-ax89x=y/' .config
          echo 'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-opkg-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-system-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-network-zh-cn=y' >> .config
          make defconfig V=s

      - name: Download sources
        run: make download -j$(nproc) V=s

      - name: Build firmware
        run: make -j$(nproc) V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ax89x-nss-firmware
          path: bin/targets/qualcommax/ipq807x/
