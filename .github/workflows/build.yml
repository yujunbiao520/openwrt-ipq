name: Build qosmio NSS OpenWrt

on:
  workflow_dispatch:
    push:
        branches:
              - main-nss

              jobs:
                build:
                    runs-on: ubuntu-22.04
                        timeout-minutes: 720

                                steps:
                                      - name: Checkout repository
                                              uses: actions/checkout@v4
                                                      with:
                                                                fetch-depth: 0
                                                                          submodules: recursive

                                                                                - name: Install build dependencies
                                                                                        run: |
                                                                                                  sudo apt update
                                                                                                            sudo apt install -y build-essential clang flex bison g++ gawk \
                                                                                                                        gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
                                                                                                                                    python3-distutils rsync unzip zlib1g-dev file wget python3-ply \
                                                                                                                                                qemu-utils libglib2.0-dev libpixman-1-dev
                                                                                                                                                
                                                                                                                                                      - name: Copy configuration
                                                                                                                                                              run: |
                                                                                                                                                                        cp .config .config.seed
                                                                                                                                                                        
                                                                                                                                                                              - name: Update feeds
                                                                                                                                                                                      run: |
                                                                                                                                                                                                ./scripts/feeds update -a
                                                                                                                                                                                                          ./scripts/feeds install -a
                                                                                                                                                                                                          
                                                                                                                                                                                                                - name: Configure OpenWrt
                                                                                                                                                                                                                        run: |
                                                                                                                                                                                                                                  cp .config.seed .config
                                                                                                                                                                                                                                            make defconfig
                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                  - name: Download source packages
                                                                                                                                                                                                                                                          run: make download -j8
                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                - name: Compile firmware
                                                                                                                                                                                                                                                                        run: |
                                                                                                                                                                                                                                                                                  make -j$(nproc) || make -j1 V=s
                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                        - name: Upload firmware artifacts
                                                                                                                                                                                                                                                                                                uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                                                                                        with:
                                                                                                                                                                                                                                                                                                                  name: ax89x-nss-firmware
                                                                                                                                                                                                                                                                                                                            path: |
                                                                                                                                                                                                                                                                                                                                        bin/targets/qualcommax/ipq807x/*asus_rt-ax89x*
                                                                                                                                                                                                                                                                                                                                        
